<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>html, body { margin: 0; background-color: #ed3341; }</style>
    <title>Web Player Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="../favicon/favicon.ico">
    <link rel="manifest" href="./game.webmanifest">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="./webgame.css?v=12">
    <meta name="theme-color" content="#ed3341">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="no-anim">
    <div class="wg-container">
        <img class="wg-cover" src="./cover.png" alt="" aria-hidden="true">

        <!-- button and progress share one grid cell, so swapping them shifts nothing -->
        <div class="wg-switch">
            <!-- the button comes first: the click unlocks audio playback for the page -->
            <button class="wg-play" id="wg-play" type="button">
                <span class="wg-play__label">PLAY</span>
                <svg class="wg-play__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M8.5 5.6 L18 12 L8.5 18.4 Z"></path>
                </svg>
            </button>

            <div class="wg-loading" id="wg-loading">
                <div class="wg-bar"><span class="wg-bar__fill" id="wg-bar-fill"></span></div>
                <div class="wg-loading__label" id="wg-loading-label">LOADING</div>
            </div>
        </div>

        <!-- iOS has no fullscreen API for pages; shown only there (see ui-effects.js) -->
        <p class="wg-ios-hint" id="wg-ios-hint">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 3.5 L12 14" />
                <path d="M8.4 7 L12 3.4 L15.6 7" />
                <path d="M7 11.5 H5.5 V20.5 H18.5 V11.5 H17" />
            </svg>
            <span>Share &rarr; Add to Home Screen for fullscreen</span>
        </p>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- shown on phones whenever the screen is portrait -->
    <div class="wg-rotate" id="wg-rotate" aria-hidden="true">
        <span class="wg-phone" aria-hidden="true"></span>
        <p class="wg-rotate__text">Rotate your device</p>
    </div>

    <script src="./native-bridge.js?v=12"></script>
    <script src="./ui-effects.js?v=12"></script>
    <script src="Build/Web.loader.js"></script>
    <script src="./unity-init.js?v=12"></script>
</body>
</html>
